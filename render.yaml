# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: securepass-ai
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/python main.py
    healthCheckPath: /api/questions
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL     # Neon connection string, set in the Render dashboard
        sync: false
      - key: GEMINI_API_KEY   # optional: enables AI advice
        sync: false
      - key: ADMIN_TOKEN      # protects /api/stats
        generateValue: true
