[project]
name = "hackathon-11-oct-2026"
version = "0.1.0"
description = "A password strength checker website that combines automatic analysis with yes/no questions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

# Vercel: the FastAPI app lives in app/main.py (the root main.py only starts Uvicorn).
[tool.vercel]
entrypoint = "app.main:app"
